name: Fineract Messaging Smoke Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke-test:
    name: Smoke Test with ${{ matrix.messaging }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - messaging: ActiveMQ
            compose_file: docker-compose-postgresql-activemq.yml
          - messaging: Kafka
            compose_file: docker-compose-postgresql-kafka.yml

    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
      IMAGE_NAME: fineract

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v4

      - name: Build the image
        run: ./gradlew --no-daemon --console=plain :fineract-provider:jibDockerBuild -Djib.to.image=$IMAGE_NAME -x test -x cucumber

      - name: Prepare directories for Docker volumes
        run: |
          mkdir -p build/fineract/logs
          mkdir -p config/docker/aws/etc
          touch config/docker/aws/etc/credentials

      - name: Start the ${{ matrix.messaging }} Stack
        run: docker compose -f ${{ matrix.compose_file }} -p fineract up --scale fineract-worker=1 -d

      - name: Wait for Fineract Manager to be healthy
        run: |
          echo "Waiting for fineract-manager to become healthy..."
          CONTAINER_NAME=$(docker compose -f ${{ matrix.compose_file }} -p fineract ps -q fineract-manager)
          if [ -z "$CONTAINER_NAME" ]; then
            echo "Error: fineract-manager container not found!"
            docker compose -f ${{ matrix.compose_file }} -p fineract ps -a
            exit 1
          fi
          echo "Container ID: $CONTAINER_NAME"

          # Wait up to 10 minutes for the container to become healthy
          # Don't exit on 'unhealthy' during the first 3 minutes (startup period)
          START_TIME=$(date +%s)
          STARTUP_GRACE_PERIOD=180
          MAX_WAIT=600

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))

            if [ $ELAPSED -gt $MAX_WAIT ]; then
              echo "Timeout waiting for container to become healthy after ${MAX_WAIT}s"
              exit 1
            fi

            STATUS=$(docker inspect --format='{{.State.Health.Status}}' $CONTAINER_NAME 2>/dev/null || echo 'not-running')
            echo "Status: $STATUS (elapsed: ${ELAPSED}s)"

            if [ "$STATUS" = 'healthy' ]; then
              echo "Fineract Manager is healthy!"
              break
            fi

            if [ "$STATUS" = 'unhealthy' ] && [ $ELAPSED -gt $STARTUP_GRACE_PERIOD ]; then
              echo "Container is unhealthy after grace period!"
              exit 1
            fi

            sleep 10
          done

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Docker PS ==="
          docker ps -a
          echo ""
          echo "=== Fineract Manager Logs ==="
          docker compose -f ${{ matrix.compose_file }} -p fineract logs fineract-manager 2>&1 | tail -500
          echo ""
          echo "=== Database Logs ==="
          docker compose -f ${{ matrix.compose_file }} -p fineract logs db 2>&1 | tail -100
          echo ""
          echo "=== Kafka Logs (if applicable) ==="
          docker compose -f ${{ matrix.compose_file }} -p fineract logs kafka 2>&1 | tail -100 || true
          echo ""
          echo "=== ActiveMQ Logs (if applicable) ==="
          docker compose -f ${{ matrix.compose_file }} -p fineract logs activemq 2>&1 | tail -100 || true

      - name: Check the stack
        run: docker ps

      - name: Check health Manager
        run: curl -f -k --retry 60 --retry-all-errors --connect-timeout 30 --retry-delay 30 https://localhost:8443/fineract-provider/actuator/health

      - name: Check health Worker1
        run: curl -f -k --retry 60 --retry-all-errors --connect-timeout 30 --retry-delay 30 https://localhost:8444/fineract-provider/actuator/health

      - name: Check info Manager
        run: (( $(curl -f -k --retry 5 --retry-all-errors --connect-timeout 30 --retry-delay 30 https://localhost:8443/fineract-provider/actuator/info | wc --chars) > 100 ))

      - name: Check info Worker1
        run: (( $(curl -f -k --retry 5 --retry-all-errors --connect-timeout 30 --retry-delay 30 https://localhost:8444/fineract-provider/actuator/info | wc --chars) > 100 ))

      - name: Run Smoke Test with Remote COB
        run: ./gradlew --no-daemon --console=plain :integration-tests:cleanTest :integration-tests:test --tests "org.apache.fineract.integrationtests.investor.externalassetowner.InitiateExternalAssetOwnerTransferTest.saleActiveLoanToExternalAssetOwnerAndBuybackADayLater" -PcargoDisabled
