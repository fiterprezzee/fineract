name: Build & deploy prod

# Builds an immutable <sha>-prod image on merge to prezzee/prod,
# then auto-dispatches the gated prod deployment workflow.

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Commit SHA, tag, or branch to build. Defaults to the selected ref.
        required: false
        type: string
  push:
    branches:
      - prezzee/prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 364777501454.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: prezzeepay/fineract

permissions:
  id-token: write
  contents: read
  actions: write  # needed to dispatch deploy.yaml

jobs:
  build-and-push:
    name: Build prod image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Resolve image tag
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "image_tag=$SHORT_SHA-prod" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::364777501454:role/pp-core-euc1-artifacts-fineract-gha
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image (Jib)
        run: |
          ./gradlew --no-daemon --console=plain \
            :fineract-provider:clean \
            :fineract-provider:build \
            :fineract-provider:jibDockerBuild \
            -x test -x cucumber -x spotlessCheck -x rat -x checkstyleMain

      - name: Push immutable commit tag
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker tag fineract:latest ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG

      - name: Summary
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          echo "### Build complete" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Auto-dispatching gated deploy to prod..." >> $GITHUB_STEP_SUMMARY

  dispatch-deploy:
    name: Dispatch deploy → prod
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          gh workflow run deploy.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.ref_name }}" \
            --field environment=prod \
            --field version="$IMAGE_TAG"
