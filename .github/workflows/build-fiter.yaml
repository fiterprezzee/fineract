name: Fineract Prezzee Build

# Builds and pushes an immutable commit-tagged image to ECR.
# Does NOT promote current-* — that happens in prezzeepay-infra deploy workflow
# after a successful ECS deployment.
#
# Tag format:  dev-<sha> | uat-<sha> | main-<sha>
# Triggered:   on push to tracked branches, or manually via workflow_dispatch.

on:
  push:
    branches:
      - prezzee/dev
      - prezzee/uat
      - prezzee/main
  workflow_dispatch:
    inputs:
      branch_override:
        description: "Override slug (dev/uat/main) — leave blank to derive from branch"
        required: false
        default: ""

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 364777501454.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: prezzeepay/fineract

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
        with:
          fetch-depth: 0

      - name: Resolve image tag
        id: meta
        run: |
          if [[ -n "${{ inputs.branch_override }}" ]]; then
            SLUG="${{ inputs.branch_override }}"
          else
            case "${{ github.ref_name }}" in
              prezzee/dev)  SLUG=dev  ;;
              prezzee/uat)  SLUG=uat  ;;
              prezzee/main) SLUG=main ;;
              *)            SLUG=dev  ;;
            esac
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "image_tag=$SLUG-$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "slug=$SLUG"                 >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::364777501454:role/pp-core-euc1-artifacts-prezzee-fineract-gha
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image (Jib)
        run: |
          ./gradlew --no-daemon --console=plain \
            :fineract-provider:clean \
            :fineract-provider:build \
            :fineract-provider:jibDockerBuild \
            -x test -x cucumber -x spotlessCheck -x rat -x checkstyleMain

      - name: Push immutable commit tag
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker tag fineract:latest ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG

      - name: Summary
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          echo "### Build complete" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To deploy: trigger **deploy-fineract** in \`prezzeepay-infra\` with version \`$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
