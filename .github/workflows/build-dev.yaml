name: Build dev image

# Builds an immutable dev-<sha> image and auto-deploys to dev ECS.
# Triggered on push to prezzee/dev, or manually (with optional commit SHA rebuild).

on:
  push:
    branches:
      - prezzee/dev
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Rebuild from a specific commit SHA (leave blank for HEAD)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 364777501454.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: prezzeepay/fineract

permissions:
  id-token: write
  contents: read
  actions: write  # needed to dispatch deploy.yaml

jobs:
  build-and-push:
    name: Build dev image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha || '' }}

      - name: Resolve image tag
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "image_tag=dev-$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::364777501454:role/pp-core-euc1-artifacts-prezzee-fineract-gha
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image (Jib)
        run: |
          ./gradlew --no-daemon --console=plain \
            :fineract-provider:clean \
            :fineract-provider:build \
            :fineract-provider:jibDockerBuild \
            -x test -x cucumber -x spotlessCheck -x rat -x checkstyleMain

      - name: Push immutable commit tag
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker tag fineract:latest ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG

      - name: Summary
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          echo "### Build complete" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Auto-dispatching deploy to dev..." >> $GITHUB_STEP_SUMMARY

  dispatch-deploy:
    name: Dispatch deploy → dev (${{ matrix.component }})
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [fineract, fineract-batch]
    steps:
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          gh workflow run deploy.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.ref_name }}" \
            --field environment=dev \
            --field component=${{ matrix.component }} \
            --field version="$IMAGE_TAG"
